[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-ffn-curvature-extraction"
version = "0.1.0"
description = "Shared-stencil curvature extraction of smooth transformer FFNs"
readme = { file = "README.txt", content-type = "text/plain" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]
